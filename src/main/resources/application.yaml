spring:
  application:
    name: world-tale-talk

# dot-env 설정
  config:
    import: optional:file:.env[.properties]

# 정적 리소스에 대해 캐시 사용 안함
  web:
    resources:
      cache:
        cache-control:
          nocache: true
          nostore: true
          mustrevalidate: true

# JPA 설정
  jpa:
    hibernate:
      ddl-auto: validate # Migration(Flyway) 사용으로 JPA에서 테이블 자동 생성을 하지 않음
    properties:
      hibernate:
        format_sql: true #쿼리문 보여주는 설정
    show-sql: true #쿼리문 보여주는 설정

# Migration 설정
  flyway:
    enabled: true
    baseline-on-migrate: true   # 이미 테이블이 존재할 때 필요
    locations: classpath:db/migration   # 마이그레이션 파일 위치
    baseline-version: 0 # pgvecotr 익스텐션이 설치 되어있기때문에 버전 0으로 지정해줌

  # OpenAI
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: never # JdbcChatMemory 테이블 자동 생성

    vectorstore:
      pgvector:
        initialize-schema: true # VectorStore 테이블 자동 생성 설정

    # OpenAI API Key
    openai:
      api-key: ${OPENAI_API_KEY}

      # 임베딩 모델 설정
      embedding:
        options:
          model: text-embedding-3-small
          dimensions: 1536 # 차원수
      # LLM 모델 설정
      chat:
        options:
          model: gpt-4o-mini

# Upload Config
  servlet:
    multipart:
      enabled: true
      max-request-size: 30MB
      max-file-size: 10MB

# JSON 설정 (날짜 변환 @JsonFormat)
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

#PostgreSQL 설정
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/world_tale_talk?currentSchema=public
    username: postgres
    password: postgres

  # Redis 설정
  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false # 레디스 로그 때문에 잠시 끔

  # Auth2 Google
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLINET_ID}
            client-secret: ${GOOGLE_CLINET_SECRET}
            scope:
              - email
              - profile

#Logging 설정
logging:
  level:
    org:
      springframework: INFO
      springframework.ai: DEBUG
    com:
      worldtaletalk: INFO
  pattern:
    console: "%clr(%-5level){green} %clr(%logger{36}.%M\\(\\)){cyan}: %msg%n"
