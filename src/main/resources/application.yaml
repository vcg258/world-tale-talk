spring:
  application:
    name: world-tale-talk

# dot-env 설정
  config:
    import: optional:file:.env[.properties]

# 정적 리소스에 대해 캐시 사용 안함
  web:
    resources:
      cache:
        cache-control:
          nocache: true
          nostore: true
          mustrevalidate: true

# JPA 설정
  jpa:
    open-in-view: false # DDD 서비스 레이어 트랜잭션 경계 명확화
    hibernate:
      ddl-auto: validate # Migration(Flyway) 사용으로 JPA에서 테이블 자동 생성을 하지 않음
    properties:
      hibernate:
        format_sql: true # 쿼리문 보여주는 설정
    show-sql: false # 쿼리문 보여주는 설정

# Migration 설정
  flyway:
    enabled: true
    baseline-on-migrate: true   # 이미 테이블이 존재할 때 필요
    locations: classpath:db/migration   # 마이그레이션 파일 위치
    baseline-version: 0 # pgvecotr 익스텐션이 설치 되어있기때문에 버전 0으로 지정해줌

  # OpenAI
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: never # JdbcChatMemory 테이블 자동 생성

    vectorstore:
      pgvector:
        initialize-schema: true # VectorStore 테이블 자동 생성 설정

    # OpenAI API Key
    openai:
      api-key: ${OPENAI_API_KEY}

      # 임베딩 모델 설정
      embedding:
        options:
          model: text-embedding-3-small
          dimensions: 1536 # 차원수
      # LLM 모델 설정
      chat:
        options:
          model: gpt-4o-mini

# Upload Config
  servlet:
    multipart:
      enabled: true
      max-request-size: 30MB
      max-file-size: 10MB

# JSON 설정 (날짜 변환 @JsonFormat)
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

# PostgreSQL 설정
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?currentSchema=public
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # Redis 설정
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      ssl:
        enabled: ${REDIS_SSL:true} # Redis TLS 사용 여부, 미설정 시 true (TLS 없는 Redis는 false)
      repositories:
        enabled: false # 레디스 로그 때문에 잠시 끔

  # Auth2 Google
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            scope: name, email
            client-name: Naver

          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope: profile_nickname, account_email
            client-name: Kakao

        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  # SMTP (Naver)
  mail:
    host: smtp.naver.com
    port: 465
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          timeout: 5000

# Batch
  batch:
    job:
      enabled: false # 기동시 자동 실행 방지 스케줄러로만 트리거

# 휴면계정 전환 기간, 메일 발송
app:
  base-url: ${APP_BASE_URL:http://localhost:8080} # 비밀번호 재설정 링크
  dormant:
    inactivity-days: 365
    warning-before-days: 30

# Logging 설정
logging:
  level:
    org:
      springframework: INFO
      springframework.ai: DEBUG
    com:
      worldtaletalk: INFO
  pattern:
    console: "%clr(%-5level){green} %clr(%logger{36}.%M\\(\\)){cyan}: %msg%n"

# 리버스 프록시 설정
server:
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none} # 프록시 헤더(X-Forwarded-*) 해석, 미설정 시 none (프록시 뒤에서는 framework)
