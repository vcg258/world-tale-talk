<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('별점 관리')}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header>
<main class="page">
    <div class="admin-layout">
        <div th:replace="~{fragments/layout :: adminSidebar}"></div>
        <section class="admin-content">
    <div class="page-title"><h1>별점 관리</h1></div>
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <div class="help-panel admin-help-panel"><strong>별점 관리 안내</strong><p>세계관별 사용자 평가와 리뷰를 확인하는 화면입니다. 점수는 세계관 평균 평점 계산에 반영되며, 부적절하거나 테스트에 방해되는 리뷰는 삭제할 수 있습니다.</p></div>
    <form class="filter-bar section" th:action="@{/admin/ratings}" method="get">
        <div class="field"><label>닉네임</label><input name="nickname" th:value="${nickname}"></div>
        <div class="field"><label>세계관 ID</label><input name="worldId" type="number" th:value="${worldId}"></div>
        <button class="btn" type="submit">검색</button>
    </form>
    <div class="table-wrap"><table><thead><tr><th>ID</th><th>회원</th><th>세계관</th><th>점수</th><th>리뷰</th><th>작업</th></tr></thead><tbody>
    <tr th:each="rating : ${ratings}">
        <td th:text="${rating.id}">1</td><td th:text="${rating.userNickname}">회원</td><td th:text="${rating.worldName}">세계관</td><td><span class="badge" th:text="${rating.score + '점'}">5점</span></td><td th:text="${rating.review}">리뷰</td>
        <td><form th:action="@{/admin/ratings/{id}(id=${rating.id})}" method="post" data-confirm="별점을 삭제하시겠습니까?"><button class="btn danger small" type="submit">삭제</button></form></td>
    </tr>
    </tbody></table></div>
        </section>
    </div>
</main></body></html>
