<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('관리자')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="page">
    <div class="admin-layout">
        <div th:replace="~{fragments/layout :: adminSidebar}"></div>
        <section class="admin-content">
    <div class="page-title"><h1>관리자</h1></div>
    <div class="help-panel admin-help-panel"><strong>관리자 대시보드 안내</strong><p>서비스의 핵심 지표를 빠르게 확인하는 화면입니다. 회원은 전체 가입자 수, 세계관은 등록된 세계관 수, 진행 세션은 현재 플레이 중인 세션 수, 대기 신고는 아직 처리하지 않은 신고 건수를 의미합니다.</p></div>
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <section class="grid section">
        <article class="card"><div class="card-body"><p class="muted">회원</p><h2 th:text="${stats.userCount}">0</h2></div></article>
        <article class="card"><div class="card-body"><p class="muted">세계관</p><h2 th:text="${stats.worldCount}">0</h2></div></article>
        <article class="card"><div class="card-body"><p class="muted">진행 세션</p><h2 th:text="${stats.activeSessionCount}">0</h2></div></article>
        <article class="card"><div class="card-body"><p class="muted">대기 신고</p><h2 th:text="${stats.pendingReportCount}">0</h2></div></article>
    </section>
        </section>
    </div>
</main>
</body>
</html>
