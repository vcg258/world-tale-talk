<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('세계관 통계')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="page">
    <div class="admin-layout">
        <div th:replace="~{fragments/layout :: adminSidebar}"></div>
        <section class="admin-content">
    <div class="page-title"><h1>세계관 통계</h1></div>
    <div class="help-panel admin-help-panel"><strong>세계관 통계 안내</strong><p>세계관별 이용 현황을 비교하는 화면입니다. 플레이 수와 평균 평점은 어떤 세계관이 많이 선택되고 좋은 반응을 얻는지 판단하는 기준으로 활용합니다.</p></div>
    <div class="table-wrap section"><table>
        <thead><tr><th>ID</th><th>세계관</th><th>전체</th><th>완료</th><th>포기</th><th>평점</th></tr></thead>
        <tbody><tr th:each="stat : ${worldStats}">
            <td th:text="${stat.worldId}">1</td><td th:text="${stat.worldName}">세계관</td>
            <td th:text="${stat.totalSessions}">0</td><td th:text="${stat.completedSessions}">0</td>
            <td th:text="${stat.abandonedSessions}">0</td><td th:text="${stat.ratingAvg}">0</td>
        </tr></tbody>
    </table></div>
        </section>
    </div>
</main>
</body>
</html>
