<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('채팅 신고 확인')}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header>
<main class="page">
    <div class="admin-layout">
        <div th:replace="~{fragments/layout :: adminSidebar}"></div>
        <section class="admin-content">
            <div class="page-title"><h1>채팅 신고 확인</h1><a class="btn secondary" th:href="@{/admin/report}">신고 목록</a></div>
            <div th:replace="~{fragments/layout :: alerts}"></div>
            <div class="help-panel admin-help-panel">
                <strong>채팅 맥락 안내</strong>
                <p>신고된 메시지가 어떤 흐름에서 작성됐는지 확인하는 화면입니다. 강조 표시된 행이 신고 대상 메시지입니다.</p>
            </div>

            <section class="section report-context-summary">
                <span class="badge" th:text="|세션 ${storySession.id}|">세션</span>
                <span th:text="|회원 ${storySession.users.id}|">회원</span>
                <span th:text="${storySession.worlds.name}">세계관</span>
                <span th:text="${storySession.personas.name}">페르소나</span>
                <span th:text="${storySession.status}">상태</span>
            </section>

            <div class="table-wrap section">
                <table class="report-chat-table">
                    <thead><tr><th>메시지 ID</th><th>턴</th><th>역할</th><th>내용</th><th>작성일</th></tr></thead>
                    <tbody>
                    <tr th:each="message : ${messages}" th:classappend="${message.id == targetMessage.id} ? ' highlighted-row'">
                        <td th:text="${message.id}">1</td>
                        <td th:text="${message.turn}">1</td>
                        <td><span class="badge" th:text="${message.role}">USER</span></td>
                        <td class="text-cell" th:text="${message.content}">내용</td>
                        <td th:text="${message.createdAt != null ? #temporals.format(message.createdAt, 'yyyy-MM-dd HH:mm') : '-'}">-</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</main></body></html>
