<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('공지 관리')}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header>
<main class="page">
    <div class="admin-layout">
        <div th:replace="~{fragments/layout :: adminSidebar}"></div>
        <section class="admin-content">
    <div class="page-title"><h1>공지 관리</h1><a class="btn" th:href="@{/admin/notices/new}">등록</a></div><div th:replace="~{fragments/layout :: alerts}"></div>
    <div class="help-panel admin-help-panel"><strong>공지 관리 안내</strong><p>사용자에게 노출되는 공지사항을 관리합니다. 공개 상태인 공지만 공지 목록에 노출되며, 수정으로 내용을 갱신하고 삭제로 목록에서 제거할 수 있습니다.</p></div>
    <div class="table-wrap section"><table><thead><tr><th>ID</th><th>제목</th><th>상태</th><th>작성일</th><th></th></tr></thead><tbody>
    <tr th:each="notice : ${notices}">
        <td th:text="${notice.id}">1</td>
        <td class="text-cell" th:text="${notice.title}">제목</td>
        <td><span class="badge" th:if="${notice.active}">공개</span><span class="badge" th:unless="${notice.active}">비공개</span></td>
        <td th:text="${notice.createdAt}">일시</td>
        <td class="actions">
            <form th:action="@{/admin/notices/{id}/toggle(id=${notice.id})}" method="post">
                <button class="btn warning small" th:if="${notice.active}" type="submit">비공개로 전환</button>
                <button class="btn small" th:unless="${notice.active}" type="submit">공개로 전환</button>
            </form>
            <a class="btn secondary small" th:href="@{/admin/notices/{id}/edit(id=${notice.id})}">내용수정</a>
            <form th:action="@{/admin/notices/{id}(id=${notice.id})}" method="post" data-confirm="공지사항을 삭제하시겠습니까?">
                <button class="btn danger small" type="submit">공지삭제</button>
            </form>
        </td>
    </tr>
    </tbody></table></div>
        </section>
    </div>
</main></body></html>
