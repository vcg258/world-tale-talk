<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('공지 관리')}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header>
<main class="page">
    <div class="page-title"><h1>공지 관리</h1><a class="btn" th:href="@{/admin/notices/new}">등록</a></div>
    <div th:replace="~{fragments/layout :: adminTabs}"></div><div th:replace="~{fragments/layout :: alerts}"></div>
    <div class="table-wrap section"><table><thead><tr><th>ID</th><th>제목</th><th>상태</th><th>작성일</th><th>작업</th></tr></thead><tbody>
    <tr th:each="notice : ${notices}"><td th:text="${notice.id}">1</td><td th:text="${notice.title}">제목</td><td><span class="badge" th:text="${notice.active} ? '공개' : '비공개'">상태</span></td><td th:text="${notice.createdAt}">일시</td><td class="actions"><a class="btn secondary small" th:href="@{/admin/notices/{id}/edit(id=${notice.id})}">수정</a><form th:action="@{/admin/notices/{id}(id=${notice.id})}" method="post" data-confirm="공지사항을 삭제하시겠습니까?"><button class="btn danger small" type="submit">삭제</button></form></td></tr>
    </tbody></table></div>
</main></body></html>
