<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('세션 관리')}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header>
<main class="page">
    <div class="page-title"><h1>세션 관리</h1></div><div th:replace="~{fragments/layout :: adminTabs}"></div>
    <form class="filter-bar section" th:action="@{/admin/sessions}" method="get"><div class="field"><label>회원 ID</label><input name="userId" type="number" th:value="${userId}"></div><div class="field"><label>세계관</label><select name="worldId"><option value="">전체</option><option th:each="world : ${worlds}" th:value="${world.id}" th:text="${world.name}" th:selected="${worldId != null and worldId == world.id}">세계관</option></select></div><div class="field"><label>상태</label><select name="status"><option value="">전체</option><option value="PLAYING" th:selected="${status != null and status.name() == 'PLAYING'}">PLAYING</option><option value="COMPLETED" th:selected="${status != null and status.name() == 'COMPLETED'}">COMPLETED</option><option value="ABANDONED" th:selected="${status != null and status.name() == 'ABANDONED'}">ABANDONED</option></select></div><button class="btn" type="submit">검색</button></form>
    <div class="table-wrap"><table><thead><tr><th>ID</th><th>회원</th><th>세계관</th><th>페르소나</th><th>상태</th><th>턴</th><th>작업</th></tr></thead><tbody><tr th:each="session : ${sessions}"><td th:text="${session.id}">1</td><td th:text="${session.userId}">1</td><td th:text="${session.worldName}">세계관</td><td th:text="${session.personaName}">페르소나</td><td><span class="badge" th:text="${session.status}">상태</span></td><td th:text="${session.currentTurn}">0</td><td class="actions"><form th:action="@{/admin/sessions/{id}/abandon(id=${session.id})}" method="post"><button class="btn warning small" type="submit">포기</button></form><form th:action="@{/admin/sessions/{id}/hidden(id=${session.id})}" method="post"><button class="btn secondary small" type="submit">숨김/복구</button></form></td></tr></tbody></table></div>
</main></body></html>
