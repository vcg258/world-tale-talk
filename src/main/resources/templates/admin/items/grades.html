<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('아이템 등급 설정')}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header>
<main class="page">
    <div class="admin-layout">
        <div th:replace="~{fragments/layout :: adminSidebar}"></div>
        <section class="admin-content">
            <div class="page-title">
                <div>
                    <h1>아이템 등급 설정</h1>
                    <p>등급별 스탯 제한을 한 표에서 비교하고 바로 수정합니다.</p>
                </div>
                <a class="btn secondary" th:href="@{/admin/items/probabilities}">확률 설정</a>
            </div>
            <div th:replace="~{fragments/layout :: alerts}"></div>
            <div class="table-wrap section">
                <table class="admin-config-table">
                    <thead>
                    <tr>
                        <th>등급</th>
                        <th>스탯 합산 최대치</th>
                        <th>단일 최대치</th>
                        <th>단일 최소치</th>
                        <th>음수 허용</th>
                        <th>작업</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="config : ${gradeConfigs}">
                        <td><span class="badge" th:text="${config.grade}">GRADE</span></td>
                        <td>
                            <form class="table-row-form" th:id="${'grade-config-' + config.id}" th:action="@{/admin/items/grades/{id}(id=${config.id})}" method="post">
                                <input name="statSumMax" type="number" min="1" th:value="${config.statSumMax}" required>
                            </form>
                        </td>
                        <td><input name="singleMax" type="number" min="1" th:value="${config.singleMax}" th:attr="form=${'grade-config-' + config.id}" required></td>
                        <td><input name="singleMin" type="number" th:value="${config.singleMin}" th:attr="form=${'grade-config-' + config.id}" required></td>
                        <td>
                            <select name="canNegative" th:attr="form=${'grade-config-' + config.id}">
                                <option value="true" th:selected="${config.canNegative}">허용</option>
                                <option value="false" th:selected="${!config.canNegative}">불가</option>
                            </select>
                        </td>
                        <td><button class="btn small" type="submit" th:attr="form=${'grade-config-' + config.id}">저장</button></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</main></body></html>
