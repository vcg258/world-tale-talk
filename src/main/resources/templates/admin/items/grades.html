<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('아이템 등급 설정')}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header>
<main class="page">
    <div class="page-title"><h1>아이템 등급 설정</h1><a class="btn secondary" th:href="@{/admin/items/probabilities}">확률 설정</a></div>
    <div th:replace="~{fragments/layout :: adminTabs}"></div><div th:replace="~{fragments/layout :: alerts}"></div>
    <div class="grid section">
        <section class="card" th:each="config : ${gradeConfigs}"><div class="card-body">
            <h2 th:text="${config.grade}">GRADE</h2>
            <form class="form" th:action="@{/admin/items/grades/{id}(id=${config.id})}" method="post">
                <div class="field"><label>스탯 합산 최대치</label><input name="statSumMax" type="number" min="1" th:value="${config.statSumMax}" required></div>
                <div class="field"><label>단일 최대치</label><input name="singleMax" type="number" min="1" th:value="${config.singleMax}" required></div>
                <div class="field"><label>단일 최소치</label><input name="singleMin" type="number" th:value="${config.singleMin}" required></div>
                <div class="field"><label>음수 허용</label><select name="canNegative"><option value="true" th:selected="${config.canNegative}">허용</option><option value="false" th:selected="${!config.canNegative}">불가</option></select></div>
                <button class="btn" type="submit">저장</button>
            </form>
        </div></section>
    </div>
</main></body></html>
