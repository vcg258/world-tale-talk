<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('아이템 확률 설정')}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header>
<main class="page">
    <div class="page-title"><h1>아이템 확률 설정</h1><a class="btn secondary" th:href="@{/admin/items/grades}">등급 설정</a></div>
    <div th:replace="~{fragments/layout :: adminTabs}"></div><div th:replace="~{fragments/layout :: alerts}"></div>
    <section class="section stack" th:each="phase : ${phases}">
        <h2 th:text="${phase}">PHASE</h2>
        <div class="table-wrap"><table><thead><tr><th>등급</th><th>확률</th><th>작업</th></tr></thead><tbody>
        <tr th:each="probability : ${probabilitiesByPhase[phase]}">
            <td th:text="${probability.grade}">GRADE</td>
            <td><form class="inline-form" th:action="@{/admin/items/probabilities/{id}(id=${probability.id})}" method="post"><input name="probability" type="number" min="0" max="100" th:value="${probability.probability}" required><button class="btn small" type="submit">저장</button></form></td>
            <td class="muted" th:text="${probability.updatedAt}">일시</td>
        </tr>
        </tbody></table></div>
    </section>
</main></body></html>
