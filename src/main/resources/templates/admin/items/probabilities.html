<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('아이템 확률 설정')}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header>
<main class="page">
    <div class="admin-layout">
        <div th:replace="~{fragments/layout :: adminSidebar}"></div>
        <section class="admin-content">
            <div class="page-title">
                <div>
                    <h1>아이템 확률 설정</h1>
                    <p>DB에 저장된 초기 확률을 불러와 전체 구간과 등급을 하나의 표에서 수정합니다.</p>
                </div>
                <a class="btn secondary" th:href="@{/admin/items/grades}">등급 설정</a>
            </div>
            <div th:replace="~{fragments/layout :: alerts}"></div>
            <div class="help-panel admin-help-panel"><strong>아이템 확률 설정 안내</strong><p>스토리 진행 단계별 아이템 등급 등장 확률을 관리합니다. 각 행은 특정 단계와 등급의 조합이며, 확률 값은 해당 상황에서 그 등급 아이템이 선택될 가능성을 뜻합니다.</p></div>
            <div class="table-wrap section">
                <table class="admin-config-table">
                    <thead>
                    <tr>
                        <th>구간</th>
                        <th>등급</th>
                        <th>확률</th>
                        <th>최근 수정</th>
                        <th>작업</th>
                    </tr>
                    </thead>
                    <tbody th:each="phase : ${phases}">
                    <tr th:each="probability, iter : ${probabilitiesByPhase[phase]}">
                        <td th:if="${iter.first}" th:rowspan="${#lists.size(probabilitiesByPhase[phase])}">
                            <span class="badge" th:text="${phase}">PHASE</span>
                        </td>
                        <td th:text="${probability.grade}">GRADE</td>
                        <td>
                            <form class="table-row-form" th:id="${'grade-probability-' + probability.id}" th:action="@{/admin/items/probabilities/{id}(id=${probability.id})}" method="post">
                                <input name="probability" type="number" min="0" max="100" th:value="${probability.probability}" required>
                            </form>
                        </td>
                        <td class="muted" th:text="${probability.updatedAt}">일시</td>
                        <td><button class="btn small" type="submit" th:attr="form=${'grade-probability-' + probability.id}">저장</button></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</main></body></html>
