<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${world.name})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="page narrow">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <section class="hero">
        <div class="meta">
            <span class="badge" th:text="${world.genre}">장르</span>
            <span th:text="'목표 ' + ${world.targetTurn} + '턴'">목표 턴</span>
            <span th:text="'평점 ' + (${world.ratingAvg} ?: '0')">평점</span>
        </div>
        <h1 th:text="${world.name}">세계관</h1>
        <p th:text="${world.description}">세계관 설명</p>
        <div class="actions">
            <a class="btn" th:href="@{/worlds/{id}/personas(id=${world.id})}">페르소나 선택</a>
        </div>
    </section>
    <section class="card">
        <div class="card-body">
            <h2>세계관 설정</h2>
            <p class="muted" th:text="${world.settingText}">설정 텍스트</p>
        </div>
    </section>

    <section class="section world-review-section">
        <div class="page-title compact-title">
            <h2>리뷰</h2>
        </div>
        <div class="review-list" th:if="${ratings != null and !#lists.isEmpty(ratings)}">
            <article class="review-item" th:each="rating : ${ratings}">
                <div class="review-summary-row">
                    <span class="review-stars" aria-label="별점">★</span>
                    <strong th:text="${rating.score + '점'}">5점</strong>
                    <span class="muted" th:text="${rating.userNickname}">닉네임</span>
                    <a class="btn secondary small" th:href="@{/reports/new(targetType='REVIEW',targetId=${rating.id})}">신고</a>
                </div>
                <p class="review-text" th:text="${rating.review ?: '작성된 평가가 없습니다.'}">평가 내용</p>
            </article>
        </div>
        <p class="muted" th:if="${ratings == null or #lists.isEmpty(ratings)}">아직 등록된 리뷰가 없습니다.</p>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
