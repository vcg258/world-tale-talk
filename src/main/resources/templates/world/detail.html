<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${world.name})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="page narrow">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <section class="hero">
        <div class="meta">
            <span class="badge" th:text="${world.genre}">장르</span>
            <span th:text="'목표 ' + ${world.targetTurn} + '턴'">목표 턴</span>
            <span th:text="'평점 ' + (${world.ratingAvg} ?: '0')">평점</span>
        </div>
        <h1 th:text="${world.name}">세계관</h1>
        <p th:text="${world.description}">세계관 설명</p>
        <div class="actions">
            <a class="btn" th:href="@{/worlds/{id}/personas(id=${world.id})}">페르소나 선택</a>
            <a class="btn secondary" th:href="@{/reports/new(targetType='CHAT_MESSAGE',targetId=${world.id})}">신고</a>
        </div>
    </section>
    <section class="card">
        <div class="card-body">
            <h2>세계관 설정</h2>
            <p class="muted" th:text="${world.settingText}">설정 텍스트</p>
        </div>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
