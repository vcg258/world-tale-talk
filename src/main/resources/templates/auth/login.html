<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('로그인')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="page narrow">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <section class="card">
        <div class="card-body">
            <h1>로그인</h1>
            <p class="alert error" th:if="${param.error}">로그인 정보를 확인해주세요.</p>
            <p class="alert message" th:if="${param.expired}">세션이 만료되었습니다. 다시 로그인해주세요.</p>
            <form class="form" th:action="@{/auth/login}" method="post">
                <div class="field">
                    <label for="loginId">아이디</label>
                    <input id="loginId" name="loginId" autocomplete="username" required>
                </div>
                <div class="field">
                    <label for="password">비밀번호</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                </div>
                <label class="inline-form"><input type="checkbox" name="rememberMe"> 로그인 유지</label>
                <button class="btn" type="submit">로그인</button>
            </form>
            <div class="actions section">
                <a class="btn secondary small" th:href="@{/auth/signup}">회원가입</a>
                <a class="btn secondary small" th:href="@{/auth/find-id}">아이디 찾기</a>
                <a class="btn secondary small" th:href="@{/auth/find-password}">비밀번호 찾기</a>
                <a class="btn secondary small" th:href="@{/oauth2/authorization/google}">Google</a>
                <a class="btn secondary small" th:href="@{/oauth2/authorization/kakao}">Kakao</a>
                <a class="btn secondary small" th:href="@{/oauth2/authorization/naver}">Naver</a>
            </div>
        </div>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
