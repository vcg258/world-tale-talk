<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('비밀번호 재설정')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="page narrow">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <section class="card"><div class="card-body">
        <h1>비밀번호 재설정</h1>
        <form class="form" th:action="@{/auth/reset-password}" method="post">
            <input type="hidden" name="token" th:value="${token}">
            <div class="field"><label>새 비밀번호</label><input name="newPassword" type="password" required></div>
            <div class="field"><label>새 비밀번호 확인</label><input name="confirmPassword" type="password" required></div>
            <button class="btn" type="submit">변경</button>
        </form>
    </div></section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
