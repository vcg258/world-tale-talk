<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('비밀번호 찾기')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="page narrow">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <section class="card"><div class="card-body">
        <h1>비밀번호 찾기</h1>
        <form class="form" th:action="@{/auth/find-password}" method="post">
            <div class="field"><label>아이디</label><input name="loginId" required></div>
            <div class="field"><label>이메일</label><input name="email" type="email" required></div>
            <button class="btn" type="submit">재설정 메일 받기</button>
        </form>
        <div class="actions section auth-link-actions one-column">
            <a class="btn secondary" th:href="@{/auth/login}">로그인 창으로</a>
        </div>
    </div></section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
