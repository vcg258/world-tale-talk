<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('회원가입')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="page narrow">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <section class="card">
        <div class="card-body">
            <h1>회원가입</h1>
            <form class="form" th:action="@{/auth/signup}" method="post" data-signup-form novalidate>
                <div class="field">
                    <label for="signup-login-id">아이디</label>
                    <input id="signup-login-id" name="loginId" autocomplete="username" minlength="4" maxlength="30" pattern="[A-Za-z0-9]{4,30}" required data-check-url="/auth/signup/check-id" data-check-param="loginId" data-check-kind="아이디">
                    <p class="field-hint" data-feedback-for="loginId">영문과 숫자 4~30자로 입력해주세요.</p>
                </div>
                <div class="field">
                    <label for="signup-nickname">닉네임</label>
                    <input id="signup-nickname" name="nickname" maxlength="50" required data-check-url="/auth/nickname/check" data-check-param="nickname" data-check-kind="닉네임">
                    <p class="field-hint" data-feedback-for="nickname">서비스에서 사용할 닉네임을 입력해주세요.</p>
                </div>
                <div class="field">
                    <label for="signup-email">이메일</label>
                    <input id="signup-email" name="email" type="email" maxlength="70" autocomplete="email" required data-check-url="/auth/signup/check-email" data-check-param="email" data-check-kind="이메일">
                    <p class="field-hint" data-feedback-for="email">로그인 복구와 알림에 사용할 이메일입니다.</p>
                </div>
                <div class="field">
                    <label for="signup-password">비밀번호</label>
                    <input id="signup-password" name="password" type="password" minlength="8" maxlength="50" autocomplete="new-password" required data-password>
                    <p class="field-hint" data-feedback-for="password">8~50자, 한글 없이 입력해주세요.</p>
                </div>
                <div class="field">
                    <label for="signup-confirm-password">비밀번호 확인</label>
                    <input id="signup-confirm-password" name="confirmPassword" type="password" autocomplete="new-password" required data-confirm-password>
                    <p class="field-hint" data-feedback-for="confirmPassword">비밀번호와 같은 값을 입력하면 통과됩니다.</p>
                </div>
                <button class="btn" type="submit" data-submit>가입하기</button>
            </form>
        </div>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/signup.js}"></script>
</body>
</html>
