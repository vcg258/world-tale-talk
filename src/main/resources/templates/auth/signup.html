<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('회원가입')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="page narrow">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <section class="card">
        <div class="card-body">
            <h1>회원가입</h1>
            <form class="form" th:action="@{/auth/signup}" method="post">
                <div class="field"><label>아이디</label><input name="loginId" required></div>
                <div class="field"><label>닉네임</label><input name="nickname" required></div>
                <div class="field"><label>이메일</label><input name="email" type="email" required></div>
                <div class="field"><label>비밀번호</label><input name="password" type="password" required></div>
                <div class="field"><label>비밀번호 확인</label><input name="confirmPassword" type="password" required></div>
                <button class="btn" type="submit">가입하기</button>
            </form>
        </div>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
