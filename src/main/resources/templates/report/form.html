<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('신고하기')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="page narrow">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <section class="card"><div class="card-body">
        <h1>신고하기</h1>
        <p class="muted">부적절한 리뷰나 채팅 메시지를 신고할 수 있습니다. 접수된 신고는 관리자가 확인한 뒤 처리합니다.</p>
        <div class="report-target-summary">
            <span class="badge" th:text="${targetType != null and targetType.name() == 'REVIEW' ? '리뷰 신고' : '채팅 신고'}">신고 대상</span>
            <span class="muted" th:text="|대상 ID: ${targetId}|">대상 ID</span>
        </div>
        <form class="form" th:action="@{/reports}" method="post">
            <input type="hidden" name="targetType" th:value="${targetType}">
            <input type="hidden" name="targetId" th:value="${targetId}">
            <div class="field"><label>신고 사유</label><textarea name="reason" placeholder="신고 사유를 구체적으로 작성해주세요." required></textarea></div>
            <div class="form-actions">
                <button class="btn danger" type="submit">신고 접수</button>
                <a class="btn secondary" th:href="@{/}">홈으로</a>
            </div>
        </form>
    </div></section>
</main>
</body>
</html>
