<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>소셜 로그인 테스트</title>
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 100px auto; padding: 20px; }
        h2 { text-align: center; margin-bottom: 30px; }
        .section { border: 1px solid #ddd; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .section h3 { margin-top: 0; color: #333; }
        .btn { display: block; width: 100%; padding: 12px; margin-bottom: 10px;
               border: none; border-radius: 6px; font-size: 15px; cursor: pointer; text-align: center;
               text-decoration: none; box-sizing: border-box; }
        .btn-google  { background: #4285F4; color: white; }
        .btn-naver   { background: #03C75A; color: white; }
        .btn-kakao   { background: #FEE500; color: #333; }
        .btn-logout  { background: #888; color: white; }
        .btn-form    { background: #333; color: white; }
        input { width: 100%; padding: 10px; margin-bottom: 10px;
                border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        label { font-size: 13px; color: #555; }
        .info { background: #f5f5f5; border-radius: 6px; padding: 10px; font-size: 13px;
                margin-top: 10px; word-break: break-all; }
        .current-user { background: #e8f4fd; border-radius: 6px; padding: 12px; margin-bottom: 20px; font-size: 13px; }
    </style>
</head>
<body>

<h2>🔐 로그인 테스트</h2>

<!-- 현재 로그인 상태 -->
<div class="current-user" th:if="${currentUser != null}">
    ✅ 로그인 중 —
    <strong th:text="${currentUser.nickname}">닉네임</strong>
    (<span th:text="${currentUser.email}">이메일</span>)
    | 권한: <span th:text="${currentUser.role}">ROLE</span>
</div>
<div class="current-user" th:unless="${currentUser != null}" style="background:#fef3f3;">
    ❌ 비로그인 상태
</div>

<!-- 일반 로그인 -->
<div class="section">
    <h3>일반 로그인</h3>
    <form th:action="@{/auth/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <label>아이디</label>
        <input type="text" name="loginId" placeholder="로그인 아이디"/>
        <label>비밀번호</label>
        <input type="password" name="password" placeholder="비밀번호"/>
        <label>
            <input type="checkbox" name="rememberMe" value="true"/> 자동 로그인
        </label>
        <br/><br/>
        <button type="submit" class="btn btn-form">로그인</button>
    </form>
    <div class="info" th:if="${param.error}">⚠️ 아이디 또는 비밀번호가 올바르지 않습니다.</div>
</div>

<!-- 소셜 로그인 -->
<div class="section">
    <h3>소셜 로그인</h3>
    <label><input type="checkbox" id="socialRememberMe"/> 자동 로그인</label>
    <br/><br/>
    <a id="btn-google" class="btn btn-google" href="/oauth2/authorization/google">Google 로그인</a>
    <a id="btn-naver"  class="btn btn-naver"  href="/oauth2/authorization/naver">Naver 로그인</a>
    <a id="btn-kakao"  class="btn btn-kakao"  href="/oauth2/authorization/kakao">Kakao 로그인</a>
</div>

<!-- 닉네임 변경 (SecurityContext 갱신 테스트) -->
<div class="section" th:if="${currentUser != null}">
    <h3>닉네임 변경 테스트</h3>
    <form th:action="@{/mypage/profile}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="text" name="nickname" th:placeholder="${currentUser.nickname}"/>
        <button type="submit" class="btn btn-form">변경</button>
    </form>
</div>

<!-- 로그아웃 -->
<div class="section" th:if="${currentUser != null}">
    <h3>로그아웃</h3>
    <form th:action="@{/auth/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="btn btn-logout">로그아웃</button>
    </form>
</div>

<script>
    // 소셜 로그인 rememberMe 파라미터 동적 추가
    document.getElementById('socialRememberMe').addEventListener('change', function () {
        const checked = this.checked;
        ['btn-google', 'btn-naver', 'btn-kakao'].forEach(id => {
            const btn = document.getElementById(id);
            const base = btn.href.split('?')[0];
            btn.href = checked ? base + '?rememberMe=true' : base;
        });
    });
</script>

</body>
</html>
