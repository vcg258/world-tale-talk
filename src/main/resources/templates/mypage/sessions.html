<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('내 이야기')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="page">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <div class="mypage-layout">
        <aside class="mypage-sidebar">
            <a class="mypage-menu-link active" th:href="@{/mypage/sessions}">내 이야기</a>
            <a class="mypage-menu-link" th:href="@{/mypage/ratings}">내 별점</a>
            <div class="mypage-menu-group">
                <h2>프로필 관리</h2>
                <a th:href="@{/mypage/profile(section='nickname')}">닉네임 변경</a>
                <a th:href="@{/mypage/profile(section='password')}">비밀번호 변경</a>
                <a th:href="@{/mypage/profile(section='email')}">이메일 변경</a>
                <a th:href="@{/mypage/profile(section='social')}">소셜 계정</a>
                <a class="danger-link" th:href="@{/mypage/profile(section='withdraw')}">회원 탈퇴</a>
            </div>
        </aside>
        <section class="mypage-content">
            <div class="page-title"><h1>내 이야기</h1></div>
            <section class="section mypage-section-first">
                <h2>최근 이야기</h2>
                <div class="grid">
                    <article class="card" th:each="storySession : ${recentSessions}">
                        <div class="card-body">
                            <span class="badge" th:text="${storySession.status}">상태</span>
                            <h3 th:text="${storySession.worldName}">세계관</h3>
                            <p class="muted" th:text="${storySession.personaName}">페르소나</p>
                            <p class="muted" th:text="|턴 ${storySession.currentTurn}|">턴</p>
                            <div class="actions">
                                <a class="btn small" th:if="${storySession.status.name() == 'IN_PROGRESS'}" th:href="@{/sessions/{id}/play(id=${storySession.id})}">이어하기</a>
                                <a class="btn small" th:if="${storySession.status.name() == 'ENDING'}" th:href="@{/sessions/{id}/ending(id=${storySession.id})}">엔딩 확인</a>
                                <a class="btn small" th:if="${storySession.status.name() == 'EPILOGUE'}" th:href="@{/sessions/{id}/epilogue(id=${storySession.id})}">에필로그 이어가기</a>
                                <a class="btn small" th:if="${storySession.status.name() == 'COMPLETED'}" th:href="@{/sessions/{id}/epilogue(id=${storySession.id})}">에필로그 이어가기</a>
                                <span class="badge warn" th:if="${storySession.status.name() == 'ABANDONED'}">포기됨</span>
                            </div>
                        </div>
                    </article>
                </div>
                <p class="muted" th:if="${#lists.isEmpty(recentSessions)}">최근 이야기가 없습니다.</p>
            </section>
            <section class="section">
                <div class="page-title compact-title"><h2>전체 이야기</h2></div>
                <form class="filter-bar" th:action="@{/mypage/sessions}" method="get">
                    <div class="field"><label>상태</label><select name="status">
                        <option value="">전체</option>
                        <option value="IN_PROGRESS" th:selected="${status != null and status.toString() == 'IN_PROGRESS'}">진행</option>
                        <option value="ENDING" th:selected="${status != null and status.toString() == 'ENDING'}">엔딩보기</option>
                        <option value="EPILOGUE" th:selected="${status != null and status.toString() == 'EPILOGUE'}">에필로그</option>
                        <option value="COMPLETED" th:selected="${status != null and status.toString() == 'COMPLETED'}">완료</option>
                        <option value="ABANDONED" th:selected="${status != null and status.toString() == 'ABANDONED'}">포기</option>
                    </select></div>
                    <button class="btn" type="submit">검색</button>
                </form>
                <div class="table-wrap"><table>
                    <thead><tr><th>이야기</th><th>세계관</th><th>페르소나</th><th>상태</th><th>턴</th><th></th></tr></thead>
                    <tbody>
                    <tr th:each="storySession : ${sessions}">
                        <td th:text="${storySession.id}">1</td>
                        <td th:text="${storySession.worldName}">세계관</td>
                        <td th:text="${storySession.personaName}">페르소나</td>
                        <td><span class="badge" th:text="${storySession.status}">상태</span></td>
                        <td th:text="${storySession.currentTurn}">0</td>
                        <td class="actions">
                            <a class="btn small" th:if="${storySession.status.name() == 'IN_PROGRESS'}" th:href="@{/sessions/{id}/play(id=${storySession.id})}">이어가기</a>
                            <a class="btn small" th:if="${storySession.status.name() == 'ENDING'}" th:href="@{/sessions/{id}/ending(id=${storySession.id})}">엔딩보기</a>
                            <a class="btn small" th:if="${storySession.status.name() == 'EPILOGUE'}" th:href="@{/sessions/{id}/epilogue(id=${storySession.id})}">에필로그</a>
                            <a class="btn small" th:if="${storySession.status.name() == 'COMPLETED'}" th:href="@{/sessions/{id}/epilogue(id=${storySession.id})}">에필로그 이어가기</a>
                            <span class="badge warn" th:if="${storySession.status.name() == 'ABANDONED'}">포기됨</span>
                            <form th:action="@{/sessions/{id}/hide(id=${storySession.id})}" method="post" data-confirm="이야기에서 나가면 내 이야기 목록에서 보이지 않습니다. 나가시겠습니까?"><button class="btn secondary small" type="submit">나가기</button></form>
                        </td>
                    </tr>
                    </tbody>
                </table></div>
            </section>
        </section>
    </div>
</main>
</body>
</html>
