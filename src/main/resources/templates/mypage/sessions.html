<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('내 세션')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="page">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <div class="page-title"><h1>내 세션</h1></div>
    <form class="filter-bar" th:action="@{/mypage/sessions}" method="get">
        <div class="field"><label>상태</label><select name="status">
            <option value="">전체</option>
            <option value="PLAYING" th:selected="${status != null and status.name() == 'PLAYING'}">진행</option>
            <option value="COMPLETED" th:selected="${status != null and status.name() == 'COMPLETED'}">완료</option>
            <option value="ABANDONED" th:selected="${status != null and status.name() == 'ABANDONED'}">포기</option>
        </select></div>
        <button class="btn" type="submit">검색</button>
    </form>
    <div class="table-wrap"><table>
        <thead><tr><th>ID</th><th>세계관</th><th>페르소나</th><th>상태</th><th>턴</th><th>작업</th></tr></thead>
        <tbody>
        <tr th:each="session : ${sessions}">
            <td th:text="${session.id}">1</td>
            <td th:text="${session.worldName}">세계관</td>
            <td th:text="${session.personaName}">페르소나</td>
            <td><span class="badge" th:text="${session.status}">상태</span></td>
            <td th:text="${session.currentTurn}">0</td>
            <td class="actions">
                <a class="btn small" th:href="@{/sessions/{id}/play(id=${session.id})}">열기</a>
                <form th:action="@{/sessions/{id}/hide(id=${session.id})}" method="post"><button class="btn secondary small" type="submit">숨김</button></form>
            </td>
        </tr>
        </tbody>
    </table></div>
</main>
</body>
</html>
