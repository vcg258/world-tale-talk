<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('마이페이지')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="page">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <div class="page-title">
        <div>
            <h1 th:text="${user.nickname}">닉네임</h1>
            <p th:text="${user.email}">email@example.com</p>
        </div>
        <div class="actions">
            <a class="btn secondary" th:href="@{/mypage/profile}">프로필 관리</a>
            <a class="btn" th:href="@{/mypage/sessions}">내 세션</a>
        </div>
    </div>
    <section class="section">
        <h2>최근 세션</h2>
        <div class="grid">
            <article class="card" th:each="session : ${recentSessions}">
                <div class="card-body">
                    <span class="badge" th:text="${session.status}">상태</span>
                    <h3 th:text="${session.worldName}">세계관</h3>
                    <p class="muted" th:text="${session.personaName}">페르소나</p>
                    <div class="actions">
                        <a class="btn small" th:href="@{/sessions/{id}/play(id=${session.id})}">이어하기</a>
                    </div>
                </div>
            </article>
        </div>
    </section>
</main>
</body>
</html>
