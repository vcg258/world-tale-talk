<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('내 별점')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="page">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <div class="page-title"><h1>내 별점</h1></div>
    <div class="grid">
        <article class="card" th:each="rating : ${ratings}">
            <div class="card-body">
                <span class="badge" th:text="${rating.score + '점'}">5점</span>
                <h2 th:text="${rating.worldName}">세계관</h2>
                <p class="muted" th:text="${rating.review}">리뷰</p>
                <a class="btn secondary small" th:href="@{/worlds/{id}/ratings/edit(id=${rating.worldId})}">수정</a>
            </div>
        </article>
    </div>
</main>
</body>
</html>
