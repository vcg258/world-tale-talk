<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('공지')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="page narrow">
    <div class="page-title"><h1>공지</h1></div>
    <div class="stack">
        <a class="card" th:each="notice : ${notices}" th:href="@{/notices/{id}(id=${notice.id})}">
            <div class="card-body">
                <h2 th:text="${notice.title}">공지 제목</h2>
                <p class="muted" th:text="${#temporals.format(notice.createdAt, 'yyyy.MM.dd HH:mm')}">작성일</p>
            </div>
        </a>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
