<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>WebSocket 테스트</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
        h2 { color: #9cdcfe; }
        #log { border: 1px solid #444; padding: 10px; height: 450px; overflow-y: auto; background: #252526; border-radius: 4px; }
        #story-box { border: 1px solid #444; padding: 10px; min-height: 80px; background: #252526; border-radius: 4px; white-space: pre-wrap; color: #ce9178; margin-bottom: 8px; }
        #choices-box { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
        .choice-btn { background: #0e639c; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-family: monospace; }
        .choice-btn:hover { background: #1177bb; }
        .delta { color: #9cdcfe; }
        .complete { color: #4ec9b0; font-weight: bold; }
        .error { color: #f44747; font-weight: bold; }
        .system { color: #808080; font-style: italic; }
        input, button, textarea { margin: 4px; padding: 6px; background: #3c3c3c; color: #d4d4d4; border: 1px solid #555; border-radius: 3px; font-family: monospace; }
        button { cursor: pointer; }
        button:hover { background: #505050; }
        textarea { width: 400px; height: 60px; }
        label { color: #9cdcfe; }
        hr { border-color: #444; }
        .section { margin-bottom: 12px; }
    </style>
</head>
<body>
    <h2>WebSocket STOMP 테스트</h2>

    <div class="section">
        <label>Session ID: <input id="sessionId" type="number" value="7" style="width:80px"></label>
        <button onclick="connect()">연결</button>
        <button onclick="disconnect()">해제</button>
        <button onclick="startStory()" style="background:#0e639c; color:white;">스토리 시작</button>
        <span id="status" style="margin-left:10px; color:#808080">미연결</span>
    </div>

    <hr>

    <div class="section">
        <div style="color:#9cdcfe; margin-bottom:4px">스토리 출력</div>
        <div id="story-box">—</div>
        <div id="choices-box"></div>
    </div>

    <div class="section">
        <textarea id="content" placeholder="자유 입력 (FREE_TEXT)"></textarea><br>
        <button onclick="sendFreeText()">FREE_TEXT 전송</button>
        <button onclick="sendEpilogue()">에필로그 전송</button>
    </div>

    <hr>

    <div style="color:#9cdcfe; margin-bottom:4px">로그</div>
    <div id="log"></div>
    <button onclick="clearLog()" style="margin-top:6px">로그 초기화</button>

    <script>
        let stompClient = null;
        let currentStory = '';

        function addLog(msg, cls = 'system') {
            const div = document.getElementById('log');
            const line = document.createElement('div');
            line.className = cls;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            div.appendChild(line);
            div.scrollTop = div.scrollHeight;
        }

        function handleMessage(message) {
            const body = JSON.parse(message.body);
            if (body.event === 'DELTA') {
                currentStory += body.value;
                document.getElementById('story-box').textContent = currentStory;
                addLog('[DELTA] ' + body.value, 'delta');
            } else if (body.event === 'COMPLETE') {
                addLog('[COMPLETE] ' + JSON.stringify(body.result, null, 2), 'complete');
                renderChoices(body.result);
                currentStory = '';
            } else if (body.event === 'ERROR') {
                addLog('[ERROR] ' + body.value, 'error');
            }
        }

        function renderChoices(result) {
            const box = document.getElementById('choices-box');
            box.innerHTML = '';

            // 아이템 획득 이벤트
            if (result && result.createdItem) {
                const item = result.createdItem;
                const el = document.createElement('div');
                el.style.cssText = 'width:100%; padding:8px 12px; background:#2d4a2d; border:1px solid #4ec9b0; border-radius:4px; color:#4ec9b0; margin-bottom:6px;';
                el.textContent = `🎒 아이템 획득: ${item.itemName} (${item.grade}등급) - ${item.itemDescription}`;
                box.appendChild(el);
                addLog(`[ITEM GAIN] ${item.itemName} (${item.grade})`, 'complete');
            }

            // 아이템 소실 이벤트
            if (result && result.removedItemName) {
                const el = document.createElement('div');
                el.style.cssText = 'width:100%; padding:8px 12px; background:#4a2d2d; border:1px solid #f44747; border-radius:4px; color:#f44747; margin-bottom:6px;';
                el.textContent = `❌ 아이템 소실: ${result.removedItemName}`;
                box.appendChild(el);
                addLog(`[ITEM LOSE] ${result.removedItemName}`, 'error');
            }

            // 엔딩 처리
            if (result && result.endingType) {
                const el = document.createElement('div');
                el.style.cssText = 'width:100%; padding:8px 12px; background:#4a3d1a; border:1px solid #ffd700; border-radius:4px; color:#ffd700; margin-bottom:6px; font-weight:bold;';
                el.textContent = `🏁 엔딩 도달: ${result.endingType}`;
                box.appendChild(el);
                addLog(`[ENDING] ${result.endingType}`, 'complete');
                return;
            }

            if (!result || !result.choices || result.choices.length === 0) return;
            result.choices.forEach((text, idx) => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.textContent = (idx + 1) + '. ' + text;
                btn.onclick = () => sendChoice(idx + 1, text);
                box.appendChild(btn);
            });
        }

        function startStory() {
            if (!stompClient) { addLog('먼저 연결하세요', 'error'); return; }
            const sessionId = document.getElementById('sessionId').value;
            currentStory = '';
            document.getElementById('story-box').textContent = '—';
            document.getElementById('choices-box').innerHTML = '';
            addLog('스토리 시작 요청');
            stompClient.send(`/app/story/${sessionId}/start`, {}, '{}');
        }

        function connect() {
            const sessionId = document.getElementById('sessionId').value;
            const socket = new SockJS('/ws');
            stompClient = Stomp.over(socket);
            stompClient.debug = null;

            stompClient.connect({}, frame => {
                document.getElementById('status').textContent = '연결됨';
                document.getElementById('status').style.color = '#4ec9b0';
                addLog('연결 성공');

                stompClient.subscribe(`/topic/story/${sessionId}`, handleMessage);
                addLog(`/topic/story/${sessionId} 구독 완료`);

                stompClient.subscribe(`/topic/epilogue/${sessionId}`, handleMessage);
                addLog(`/topic/epilogue/${sessionId} 구독 완료`);
            }, error => {
                document.getElementById('status').textContent = '연결 실패';
                document.getElementById('status').style.color = '#f44747';
                addLog('연결 실패: ' + error, 'error');
            });

            socket.onclose = () => {
                document.getElementById('status').textContent = '연결 해제됨';
                document.getElementById('status').style.color = '#808080';
                addLog('연결 해제됨');
            };
        }

        function disconnect() {
            if (stompClient) {
                stompClient.disconnect(() => addLog('해제 완료'));
                stompClient = null;
            }
        }

        function sendChoice(choiceIndex, content) {
            if (!stompClient) { addLog('먼저 연결하세요', 'error'); return; }
            const sessionId = document.getElementById('sessionId').value;
            const payload = JSON.stringify({ type: 'CHOICE', choiceIndex, content });
            currentStory = '';
            document.getElementById('story-box').textContent = '—';
            document.getElementById('choices-box').innerHTML = '';
            addLog(`선택지 ${choiceIndex} 전송: ${content}`);
            stompClient.send(`/app/story/${sessionId}`, {}, payload);
        }

        function sendFreeText() {
            if (!stompClient) { addLog('먼저 연결하세요', 'error'); return; }
            const sessionId = document.getElementById('sessionId').value;
            const content = document.getElementById('content').value.trim();
            if (!content) { addLog('입력값을 작성하세요', 'error'); return; }
            const payload = JSON.stringify({ type: 'FREE_TEXT', content });
            currentStory = '';
            document.getElementById('story-box').textContent = '—';
            document.getElementById('choices-box').innerHTML = '';
            addLog('FREE_TEXT 전송: ' + content);
            stompClient.send(`/app/story/${sessionId}`, {}, payload);
        }

        function sendEpilogue() {
            if (!stompClient) { addLog('먼저 연결하세요', 'error'); return; }
            const sessionId = document.getElementById('sessionId').value;
            const content = document.getElementById('content').value.trim();
            if (!content) { addLog('입력값을 작성하세요', 'error'); return; }
            const payload = JSON.stringify({ content });
            currentStory = '';
            document.getElementById('story-box').textContent = '—';
            addLog('에필로그 전송: ' + content);
            stompClient.send(`/app/epilogue/${sessionId}`, {}, payload);
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }
    </script>
</body>
</html>
